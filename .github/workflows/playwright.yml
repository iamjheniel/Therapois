          name: auth-staging
          path: .auth/
      - name: 🚀 Run SuperAdmin tests (Staging)
        run: npx playwright test --project=SAJhen
      - name: 📤 Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-superadmin-staging
          path: playwright-report/
          if-no-files-found: ignore

  therapist:
    if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.environment == 'staging') && (github.event.inputs.role == 'therapist' || github.event.inputs.role == 'all' || github.event_name != 'workflow_dispatch') }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: 🗄️ Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - name: 🧱 Install browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps
      - name: 🧱 Install browser system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps
      - name: 📥 Download staging auth states
        uses: actions/download-artifact@v4
        with:
          name: auth-staging
          path: .auth/
      - name: 🚀 Run Therapist tests (Staging)
        run: npx playwright test --project=SandraZeibig
      - name: 📤 Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-therapist-staging
          path: playwright-report/
          if-no-files-found: ignore

# ─────────────────────────────────────────────
# PRODUCTION  (manual only)
# ─────────────────────────────────────────────
  setup-prod:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
