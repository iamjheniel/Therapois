name: Playwright Tests

on:
  # 🔁 Automatically run on code updates
  push:
    branches: [main, staging]
  pull_request:

  # ▶️ Manual trigger with dropdown input
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select which environment to test'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      role:
        description: 'Select which role to test'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - admin
          - superadmin
          - therapist

  # ⏰ (Optional) Scheduled daily run at 7AM UTC
  # schedule:
  #   - cron: '0 7 * * *'

jobs:
  # ✅ STEP 1: Create login sessions (Staging)
  setup:
    if: ${{ github.event.inputs.environment != 'production' || github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧱 Install browsers
        run: npx playwright install --with-deps

      - name: 🔐 Generate .auth storage states (Staging)
        run: npx playwright test --project=setup

      - name: 💾 Upload staging auth states
        uses: actions/upload-artifact@v4
        with:
          name: auth-staging
          path: .auth/
          retention-days: 1

  # ✅ STEP 1b: Create login sessions (Production)
  setup-prod:
    if: ${{ github.event.inputs.environment == 'production' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧱 Install browsers
        run: npx playwright install --with-deps

      - name: 🔐 Generate .auth storage states (Production)
        run: npx playwright test --project=setup-prod

      - name: 💾 Upload production auth states
        uses: actions/upload-artifact@v4
        with:
          name: auth-production
          path: .auth/
          retention-days: 1

  # ✅ STEP 2: Run Admin Tests
  admin:
    if: ${{ (github.event.inputs.role == 'admin' || github.event.inputs.role == 'all' || github.event_name != 'workflow_dispatch') && github.event.inputs.environment != 'production' }}
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright install
      - name: 📥 Download staging auth states
        uses: actions/download-artifact@v4
        with:
          name: auth-staging
          path: .auth/
      - name: 🚀 Run Admin tests (Staging)
        run: npx playwright test --project=AdminJhen --grep @Admin

  # ✅ STEP 3: Run SuperAdmin Tests
  superadmin:
    if: ${{ (github.event.inputs.role == 'superadmin' || github.event.inputs.role == 'all' || github.event_name != 'workflow_dispatch') && github.event.inputs.environment != 'production' }}
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright install
      - name: 📥 Download staging auth states
        uses: actions/download-artifact@v4
        with:
          name: auth-staging
          path: .auth/
      - name: 🚀 Run SuperAdmin tests (Staging)
        run: npx playwright test --project=SAJhen --grep @SuperAdmin

  # ✅ STEP 4: Run Therapist Tests
  therapist:
    if: ${{ (github.event.inputs.role == 'therapist' || github.event.inputs.role == 'all' || github.event_name != 'workflow_dispatch') && github.event.inputs.environment != 'production' }}
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright install
      - name: 📥 Download staging auth states
        uses: actions/download-artifact@v4
        with:
          name: auth-staging
          path: .auth/
      - name: 🚀 Run Therapist tests (Staging)
        run: npx playwright test --project=SandraZeibig --grep @Therapist

  # ✅ STEP 2b: Run Admin Tests (Production)
  admin-prod:
    if: ${{ (github.event.inputs.role == 'admin' || github.event.inputs.role == 'all') && github.event.inputs.environment == 'production' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    needs: setup-prod
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright install
      - name: 📥 Download production auth states
        uses: actions/download-artifact@v4
        with:
          name: auth-production
          path: .auth/
      - name: 🚀 Run Admin tests (Production)
        run: npx playwright test --project=AdminJhen-Prod --grep @Admin

  # ✅ STEP 3b: Run SuperAdmin Tests (Production)
  superadmin-prod:
    if: ${{ (github.event.inputs.role == 'superadmin' || github.event.inputs.role == 'all') && github.event.inputs.environment == 'production' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    needs: setup-prod
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright install
      - name: 📥 Download production auth states
        uses: actions/download-artifact@v4
        with:
          name: auth-production
          path: .auth/
      - name: 🚀 Run SuperAdmin tests (Production)
        run: npx playwright test --project=SAJhen-Prod --grep @SuperAdmin

  # ✅ STEP 4b: Run Therapist Tests (Production)
  therapist-prod:
    if: ${{ (github.event.inputs.role == 'therapist' || github.event.inputs.role == 'all') && github.event.inputs.environment == 'production' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    needs: setup-prod
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright install
      - name: 📥 Download production auth states
        uses: actions/download-artifact@v4
        with:
          name: auth-production
          path: .auth/
      - name: 🚀 Run Therapist tests (Production)
        run: npx playwright test --project=JhenQA-Prod --grep @Therapist

  # ✅ STEP 5: Collect Playwright report (only if any tests ran)
  report:
    runs-on: ubuntu-latest
    needs: [admin, superadmin, therapist, admin-prod, superadmin-prod, therapist-prod]
    if: always()
    steps:
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
