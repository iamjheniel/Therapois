name: Playwright Tests

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  # 🔁 Automatically run on code updates
  push:
    branches: [main, staging]
  pull_request:

  # ▶️ Manual trigger with dropdown input
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select which environment to test'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      role:
        description: 'Select which role to test'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - admin
          - superadmin
          - therapist

  # ⏰ (Optional) Scheduled daily run at 7AM UTC
  # schedule:
  #   - cron: '0 7 * * *'

# ─────────────────────────────────────────────
# STAGING  (push / pull_request / manual staging)
# ─────────────────────────────────────────────
jobs:
  setup:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.environment == 'staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 📦 Install dependencies
        run: npm ci
      - name: 🧱 Install browsers
        run: npx playwright install --with-deps
      - name: 🗑️ Clear existing staging auth so login always runs fresh
        run: rm -f .auth/AdminJhen.json .auth/SandraZeibig.json .auth/SuperAdmin.json
      - name: 🔐 Generate fresh staging auth states
        run: npx playwright test --project=setup
      - name: 💾 Upload staging auth states
        uses: actions/upload-artifact@v4
        with:
          name: auth-staging
          path: .auth/
          retention-days: 1

  admin:
    if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.environment == 'staging') && (github.event.inputs.role == 'admin' || github.event.inputs.role == 'all' || github.event_name != 'workflow_dispatch') }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright install
      - name: 📥 Download staging auth states
        uses: actions/download-artifact@v4
        with:
          name: auth-staging
          path: .auth/
      - name: 🚀 Run Admin tests (Staging)
        run: npx playwright test --project=AdminJhen --grep @Admin
      - name: 📤 Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-admin-staging
          path: playwright-report/
          if-no-files-found: ignore

  superadmin:
    if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.environment == 'staging') && (github.event.inputs.role == 'superadmin' || github.event.inputs.role == 'all' || github.event_name != 'workflow_dispatch') }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright install
      - name: 📥 Download staging auth states
        uses: actions/download-artifact@v4
        with:
          name: auth-staging
          path: .auth/
      - name: 🚀 Run SuperAdmin tests (Staging)
        run: npx playwright test --project=SAJhen --grep @SuperAdmin
      - name: 📤 Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-superadmin-staging
          path: playwright-report/
          if-no-files-found: ignore

  therapist:
    if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.environment == 'staging') && (github.event.inputs.role == 'therapist' || github.event.inputs.role == 'all' || github.event_name != 'workflow_dispatch') }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright install
      - name: 📥 Download staging auth states
        uses: actions/download-artifact@v4
        with:
          name: auth-staging
          path: .auth/
      - name: 🚀 Run Therapist tests (Staging)
        run: npx playwright test --project=SandraZeibig --grep @Therapist
      - name: 📤 Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-therapist-staging
          path: playwright-report/
          if-no-files-found: ignore

# ─────────────────────────────────────────────
# PRODUCTION  (manual only)
# ─────────────────────────────────────────────
  setup-prod:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 📦 Install dependencies
        run: npm ci
      - name: 🧱 Install browsers
        run: npx playwright install --with-deps
      - name: 🔐 Generate production auth states
        run: npx playwright test --project=setup-prod
      - name: 💾 Upload production auth states
        uses: actions/upload-artifact@v4
        with:
          name: auth-production
          path: .auth/
          retention-days: 1

  admin-prod:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production' && (github.event.inputs.role == 'admin' || github.event.inputs.role == 'all') }}
    needs: setup-prod
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright install
      - name: 📥 Download production auth states
        uses: actions/download-artifact@v4
        with:
          name: auth-production
          path: .auth/
      - name: 🚀 Run Admin tests (Production)
        run: npx playwright test --project=AdminJhen-Prod --grep @Admin
      - name: 📤 Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-admin-production
          path: playwright-report/
          if-no-files-found: ignore

  superadmin-prod:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production' && (github.event.inputs.role == 'superadmin' || github.event.inputs.role == 'all') }}
    needs: setup-prod
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright install
      - name: 📥 Download production auth states
        uses: actions/download-artifact@v4
        with:
          name: auth-production
          path: .auth/
      - name: 🚀 Run SuperAdmin tests (Production)
        run: npx playwright test --project=SAJhen-Prod --grep @SuperAdmin
      - name: 📤 Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-superadmin-production
          path: playwright-report/
          if-no-files-found: ignore

  therapist-prod:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production' && (github.event.inputs.role == 'therapist' || github.event.inputs.role == 'all') }}
    needs: setup-prod
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright install
      - name: 📥 Download production auth states
        uses: actions/download-artifact@v4
        with:
          name: auth-production
          path: .auth/
      - name: 🚀 Run Therapist tests (Production)
        run: npx playwright test --project=JhenQA-Prod --grep @Therapist
      - name: 📤 Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-therapist-production
          path: playwright-report/
          if-no-files-found: ignore
