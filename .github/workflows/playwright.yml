name: Playwright Tests

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main, staging]
  pull_request:

  workflow_dispatch:
    inputs:
      environment:
        description: 'Select which environment to test'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      role:
        description: 'Select which role to test'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - admin
          - superadmin
          - therapist

  # schedule:
  #   - cron: '0 7 * * *'

# ─────────────────────────────────────────────
# STAGING
# ─────────────────────────────────────────────
jobs:
  admin:
    if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.environment == 'staging') && (github.event.inputs.role == 'admin' || github.event.inputs.role == 'all' || github.event_name != 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: 🗄️ Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - name: 🧱 Install browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps
      - name: 🧱 Install browser system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps
      - name: 🩺 Check staging backend health
        id: health
        run: node scripts/check-staging-health.mjs
      - name: 🚀 Run Admin tests (Staging)
        if: steps.health.outputs.up == 'true'
        run: npx playwright test --project=AdminJhen
      - name: ⏭️ Staging backend down — tests skipped
        if: steps.health.outputs.up != 'true'
        run: echo "::notice::Staging backend is down (API 5xx). Admin staging tests were skipped to keep CI green. Re-run once staging recovers."
      - name: 📤 Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-admin-staging
          path: playwright-report/
          if-no-files-found: ignore

  superadmin:
    if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.environment == 'staging') && (github.event.inputs.role == 'superadmin' || github.event.inputs.role == 'all' || github.event_name != 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
