name: Playwright Tests

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  # ✅ STEP 1: Create login sessions for each role
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧱 Install browsers
        run: npx playwright install --with-deps

      - name: 🔐 Generate .auth storage states
        run: npx playwright test --project=setup

  # ✅ STEP 2: Run Admin Tests
  admin:
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright install
      - name: 🚀 Run Admin tests
        run: npx playwright test tests/admin --project=AdminJhen --grep @Admin

  # ✅ STEP 3: Run SuperAdmin Tests
  superadmin:
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright install
      - name: 🚀 Run SuperAdmin tests
        run: npx playwright test tests/superadmin --project=SAJhen --grep @SuperAdmin

  # ✅ STEP 4: Run Therapist Tests
  therapist:
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright install
      - name: 🚀 Run Therapist tests
        run: npx playwright test tests/therapist --project=SandraZeibig --grep @Therapist
      - name: Debug file
        run: ls -R ./tests/Therapist

  # ✅ STEP 5: Collect Playwright report (runs after all jobs)
  report:
    runs-on: ubuntu-latest
    needs: [admin, superadmin, therapist]
    if: always()
    steps:
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
